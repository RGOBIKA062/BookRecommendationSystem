services:
  - type: web
    name: book-backend
    env: node
    plan: starter
    region: oregon
    branch: main
    repo: RGOBIKA062/BookRecommendationSystem
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
        sync: false
